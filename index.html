<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NairaFX Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #0b0e14; color: #ffffff; font-family: sans-serif; padding: 20px; }
  </style>
</head>
<body>
  <div style="max-width: 400px; margin: 40px auto; background: #151a24; padding: 20px; border-radius: 10px; border: 1px solid #334155;">
    <h2 style="font-size: 18px; font-weight: bold; margin-bottom: 10px;">NairaFX Quick Connect</h2>
    <p style="font-size: 12px; color: #94a3b8; margin-bottom: 15px;">Project: tovlcsrjjfmsvfeibvuo.supabase.co</p>
    
    <label style="font-size: 12px; display: block; margin-bottom: 5px;">Paste Supabase Anon Key:</label>
    <input id="keyInput" type="text" placeholder="eyJ..." style="width: 100%; padding: 10px; background: #0b0e14; border: 1px solid #475569; color: white; border-radius: 5px; margin-bottom: 15px; font-size: 12px;" />
    
    <button onclick="saveAndGo()" style="width: 100%; background: #10b981; color: white; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
      Launch Terminal
    </button>
    <p id="msg" style="font-size: 12px; color: #f87171; margin-top: 10px; text-align: center;"></p>
  </div>

  <script>
    const saved = localStorage.getItem('nairafx_key');
    if (saved) {
      document.getElementById('keyInput').value = saved;
    }

    function saveAndGo() {
      const val = document.getElementById('keyInput').value.trim();
      if (!val) {
        document.getElementById('msg').innerText = 'Please paste your key!';
        return;
      }
      localStorage.setItem('nairafx_key', val);
      document.getElementById('msg').style.color = '#34d399';
      document.getElementById('msg').innerText = 'Key saved! Redirecting...';
      
      try {
        const client = window.supabase.createClient('https://tovlcsrjjfmsvfeibvuo.supabase.co', val);
        client.from('trading_accounts').select('*').limit(1).then(res => {
          if (res.error) {
            document.getElementById('msg').innerText = 'DB Error: ' + res.error.message;
          } else {
            document.getElementById('msg').innerText = 'Connected successfully! Launching full terminal...';
            setTimeout(() => {
              location.reload();
            }, 1000);
          }
        });
      } catch (e) {
        document.getElementById('msg').innerText = 'Error: ' + e.message;
      }
    }
  </script>
</body>
</html>
