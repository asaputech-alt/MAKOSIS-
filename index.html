<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nairaly | NGN Trading Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #0b0e14; color: #ffffff; font-family: system-ui, sans-serif; padding: 16px; }
  </style>
</head>
<body>
  <div style="max-width: 400px; margin: 30px auto; background: #151a24; padding: 24px; border-radius: 12px; border: 1px solid #334155;">
    <h2 style="font-size: 20px; font-weight: bold; margin-bottom: 8px;">Nairaly Quick Connect</h2>
    <p style="font-size: 13px; color: #94a3b8; margin-bottom: 16px;">Project: tovlcsrjjfmsvfeibvuo.supabase.co</p>
    
    <label style="font-size: 12px; display: block; margin-bottom: 6px; font-weight: 600;">Supabase Public Anon Key:</label>
    <input id="keyInput" type="text" placeholder="Paste your anon key here..." style="width: 100%; padding: 12px; background: #0b0e14; border: 1px solid #475569; color: white; border-radius: 8px; margin-bottom: 16px; font-size: 13px;" />
    
    <button onclick="saveKey()" style="width: 100%; background: #10b981; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer;">
      Launch Terminal
    </button>
    <p id="msg" style="font-size: 12px; color: #f87171; margin-top: 12px; text-align: center;"></p>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('nairaly_key');
      if (saved) {
        document.getElementById('keyInput').value = saved;
      }
    });

    function saveKey() {
      const val = document.getElementById('keyInput').value.trim();
      if (!val) {
        document.getElementById('msg').innerText = 'Please paste your API key!';
        return;
      }
      localStorage.setItem('nairaly_key', val);
      document.getElementById('msg').style.color = '#34d399';
      document.getElementById('msg').innerText = 'Key saved! Connecting to Supabase...';

      try {
        const client = window.supabase.createClient('https://tovlcsrjjfmsvfeibvuo.supabase.co', val);
        client.from('trading_accounts').select('*').limit(1).then(res => {
          if (res.error) {
            document.getElementById('msg').style.color = '#f87171';
            document.getElementById('msg').innerText = 'DB Error: ' + res.error.message;
          } else {
            document.getElementById('msg').innerText = 'Connected! Loading dashboard...';
            setTimeout(() => {
              location.reload();
            }, 800);
          }
        });
      } catch (e) {
        document.getElementById('msg').style.color = '#f87171';
        document.getElementById('msg').innerText = 'Error: ' + e.message;
      }
    }
  </script>
</body>
</html>
